_schema-version: 3.3.0
ID: SmartProcureX
version: 1.0.0
description: "SmartProcureX CAP project foundation."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: SmartProcureX-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: SmartProcureX-db
      - name: SmartProcureX-uaa

  - name: SmartProcureX-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: SmartProcureX-db

resources:
  - name: SmartProcureX-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: SmartProcureX-uaa
    type: com.sap.xs.uaa
    parameters:
      path: ./xs-security.json
      service: xsuaa
      service-plan: application
