_schema-version: "3.2"
ID: com.smartprocurex.smartprocurexui
version: 0.0.1

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install
        - npm run build:workspaces

modules:
  - name: com.smartprocurex.smartprocurexui
    type: nodejs
    path: .
    parameters:
      disk-quota: 1024M
      memory: 512M
    requires:
      - name: SmartProcureX-uaa
    properties:
      destinations: >
        [
          {
            "name": "srv-api",
            "url": "https://0d79b96ctrial-dev-smartprocurex-srv.cfapps.us10-003.hana.ondemand.com",
            "forwardAuthToken": true
          }
        ]

resources:
  - name: SmartProcureX-uaa
    type: org.cloudfoundry.existing-service